[package]
name = "src-overlay-sidecar-linux"
version = "0.1.0"
edition = "2024"

[dependencies]
env_logger = { version = "0.11.8", default-features = false, features = ["auto-color", "humantime"] }
log = { version = "0.4.28", features = ["release_max_level_error"] }
tokio = { version = "1.48.0", default-features = false, features = ["rt", "rt-multi-thread"] }
tonic = { version = "0.14.2"}
prost = "0.14"
tonic-prost = "*"
argh = { version = "0.1.13", default-features = false }
tonic-web = "0.14.2"
tokio-stream = "0.1.17"
tower-http = { version = "0.6.6",default-features = false,features = ["cors"] }
rand = { version = "0.9.2", default-features = false }
serde_json = "1.0.145"
serde = { version = "1.0.228", features = ["derive"] }
tokio-tungstenite = "0.28.0"
futures-util = { version = "0.3.31", default-features = false }
base64 = "0.22.1"
xr_overlay = { git = "https://codeberg.org/sofoxe1/xr_overlay", version = "0.1.0",rev="bb917b46464b0a7c2c007b110019b3518a16f487" }
xr_overlay_cef = { git = "https://codeberg.org/sofoxe1/xr_overlay", version = "0.1.0",rev="bb917b46464b0a7c2c007b110019b3518a16f487" }
[build-dependencies]
tonic-prost-build = "*"
[profile.release]
panic = "abort"   # Strip expensive panic clean-up logic
codegen-units = 1 # Compile crates one after another so the compiler can optimize better
lto = true        # Enables link to optimizations
strip = true      # Remove debug symbols
[profile.dev]
opt-level = 1
