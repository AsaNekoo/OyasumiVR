[package]
name = "src-overlay-sidecar-linux"
version = "0.1.0"
edition = "2024"

[dependencies]
env_logger = { version = "0.11.8", default-features = false, features = ["auto-color", "humantime"] }
# log = { version = "0.4.28", features = ["release_max_level_error"] }
log = { version = "0.4.28" }
tokio = { version = "1.48.0", default-features = false, features = ["rt"] }
tonic = { version = "0.14.2"}
prost = "0.14"
tonic-prost = "*"
tonic-web = "0.14.2"
tokio-stream = "0.1.17"
tower-http = { version = "0.6.6",default-features = false,features = ["cors"] }
rand = { version = "0.9.2", default-features = false }
serde_json = "1.0.145"
serde = { version = "1.0.228", features = ["derive"] }
tokio-tungstenite = "0.28.0"
futures-util = { version = "0.3.31", default-features = false }
base64 = "0.22.1"
xr_overlay = { git = "https://codeberg.org/sofoxe1/xr_overlay", version = "0.1.0",rev="1d5a7325d0fe608b2ddead31958d81a3cd7c0908" }
# xr_overlay = { path="../../xr_overlay/core/" }
xr_overlay_cef = { git = "https://codeberg.org/sofoxe1/xr_overlay", version = "0.1.0",rev="1d5a7325d0fe608b2ddead31958d81a3cd7c0908" }
# xr_overlay_cef = {  path="../../xr_overlay/cef_app/" }
[build-dependencies]
tonic-prost-build = "*"
[profile.release]
panic = "abort"   # Strip expensive panic clean-up logic
codegen-units = 32 # Compile crates one after another so the compiler can optimize better
lto = false        # Enables link to optimizations
strip = true      # Remove debug symbols
[profile.dev]
opt-level = 1
